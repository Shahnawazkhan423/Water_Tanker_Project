<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}WaterTanker{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    /* =========================================================
       DESIGN TOKENS
    ========================================================= */
    :root {
      --primary:        #2563eb;
      --primary-dark:   #1d4ed8;
      --primary-light:  #3b82f6;
      --primary-50:     #eff6ff;
      --primary-100:    #dbeafe;
      --primary-200:    #bfdbfe;

      --accent:         #0891b2;
      --accent-dark:    #0e7490;
      --accent-50:      #ecfeff;
      --accent-100:     #cffafe;

      --success:        #16a34a;
      --success-dark:   #15803d;
      --success-50:     #f0fdf4;
      --success-100:    #dcfce7;
      --success-200:    #bbf7d0;

      --warning:        #d97706;
      --warning-dark:   #b45309;
      --warning-50:     #fffbeb;
      --warning-100:    #fef3c7;
      --warning-200:    #fde68a;

      --danger:         #dc2626;
      --danger-dark:    #b91c1c;
      --danger-50:      #fef2f2;
      --danger-100:     #fee2e2;

      --bg:             #f8fafc;
      --surface:        #ffffff;
      --surface-2:      #f1f5f9;
      --border:         #e2e8f0;
      --border-light:   #f1f5f9;
      --border-medium:  #cbd5e1;

      --text-primary:   #0f172a;
      --text-secondary: #475569;
      --text-muted:     #94a3b8;
      --text-disabled:  #cbd5e1;

      --sidebar-w:      264px;
      --sidebar-bg:     #0f172a;
      --sidebar-border: #1e293b;
      --sidebar-text:   #94a3b8;
      --sidebar-active-bg:   rgba(37,99,235,.14);
      --sidebar-active-text: #93c5fd;
      --sidebar-hover-bg:    rgba(255,255,255,.06);
      --sidebar-hover-text:  #e2e8f0;

      --topbar-h: 64px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

      --r-xs:  4px; --r-sm: 6px; --r: 8px; --r-md: 10px;
      --r-lg:  12px; --r-xl: 16px; --r-2xl: 20px; --r-full: 9999px;

      --shadow-xs: 0 1px 2px 0 rgb(0 0 0/.04);
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0/.06), 0 1px 2px -1px rgb(0 0 0/.06);
      --shadow:    0 4px 6px -1px rgb(0 0 0/.07), 0 2px 4px -2px rgb(0 0 0/.05);
      --shadow-md: 0 10px 15px -3px rgb(0 0 0/.07), 0 4px 6px -4px rgb(0 0 0/.04);
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0/.08), 0 8px 10px -6px rgb(0 0 0/.04);
      --shadow-xl: 0 25px 50px -12px rgb(0 0 0/.18);
      --shadow-primary: 0 4px 16px rgba(37,99,235,.28);
      --shadow-success: 0 4px 16px rgba(22,163,74,.22);
    }

    /* =========================================================
       RESET & BASE
    ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    h1,h2,h3,h4,h5,h6 { font-weight: 600; line-height: 1.25; color: var(--text-primary); }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: var(--primary-dark); }
    img { max-width: 100%; }

    /* =========================================================
       CARDS
    ========================================================= */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
    }
    .card-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
    }
    .card-body   { padding: 20px; }
    .card-footer { background: var(--bg); border-top: 1px solid var(--border); padding: 14px 20px; }

    /* =========================================================
       BUTTONS
    ========================================================= */
    .btn {
      font-family: var(--font);
      font-weight: 500;
      font-size: 13.5px;
      border-radius: var(--r);
      transition: all .15s cubic-bezier(.4,0,.2,1);
      letter-spacing: -.01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 1px 3px rgba(37,99,235,.25); }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: #fff; box-shadow: var(--shadow-primary); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); box-shadow: none; }
    .btn-outline-primary { color: var(--primary); border-color: var(--primary); background: transparent; }
    .btn-outline-primary:hover { background: var(--primary); border-color: var(--primary); color: #fff; transform: translateY(-1px); }
    .btn-success { background: var(--success); border-color: var(--success); color: #fff; }
    .btn-success:hover { background: var(--success-dark); border-color: var(--success-dark); color: #fff; transform: translateY(-1px); box-shadow: var(--shadow-success); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-dark); border-color: var(--danger-dark); color: #fff; transform: translateY(-1px); }
    .btn-warning { background: var(--warning); border-color: var(--warning); color: #fff; }
    .btn-warning:hover { background: var(--warning-dark); border-color: var(--warning-dark); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--border-light); color: var(--text-primary); border-color: var(--border-medium); }
    .btn-sm { font-size: 12px; padding: 5px 12px; border-radius: var(--r-sm); }
    .btn-lg { font-size: 15px; padding: 12px 28px; }

    .btn-loading { pointer-events: none; color: transparent !important; }
    .btn-loading::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* =========================================================
       FORMS
    ========================================================= */
    .form-control, .form-select {
      font-family: var(--font);
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      padding: 10px 13px;
      color: var(--text-primary);
      background: var(--surface);
      transition: border-color .15s, box-shadow .15s;
      width: 100%;
    }
    .form-control::placeholder { color: var(--text-muted); }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
      outline: none;
    }
    .form-control.is-valid { border-color: var(--success); }
    .form-control.is-valid:focus { box-shadow: 0 0 0 3px rgba(22,163,74,.1); }
    .form-control.is-invalid { border-color: var(--danger); }
    .form-control.is-invalid:focus { box-shadow: 0 0 0 3px rgba(220,38,38,.1); }
    .form-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; display: block; }
    .form-text  { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
    .invalid-feedback { font-size: 12px; color: var(--danger); }
    .valid-feedback   { font-size: 12px; color: var(--success); }

    /* Input with icon */
    .input-wrap { position: relative; }
    .input-wrap .input-icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
      z-index: 1;
    }
    .input-wrap .icon-left  { left: 13px; }
    .input-wrap .icon-right { right: 13px; pointer-events: auto; }
    .input-wrap .form-control.pl { padding-left: 40px; }
    .input-wrap .form-control.pr { padding-right: 40px; }

    /* Eye button for password */
    .btn-eye {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; padding: 4px 6px; border-radius: var(--r-sm);
      font-size: 15px; transition: color .1s; display: flex; align-items: center; z-index: 2;
    }
    .btn-eye:hover { color: var(--text-secondary); }

    /* Floating labels */
    .form-floating > .form-control,
    .form-floating > .form-select { padding: 16px 13px 8px; height: auto; min-height: 52px; }
    .form-floating > label { color: var(--text-muted); font-size: 13px; padding: 14px 13px; }

    /* =========================================================
       BADGES
    ========================================================= */
    .badge {
      font-family: var(--font); font-weight: 500;
      font-size: 11px; padding: 3px 8px;
      border-radius: var(--r-full); letter-spacing: .02em;
    }

    /* Status Badges */
    .status-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11.5px; font-weight: 600;
      padding: 3px 10px; border-radius: var(--r-full); letter-spacing: .01em;
    }
    .status-pending    { background: var(--warning-100); color: var(--warning); }
    .status-accepted   { background: var(--success-100); color: var(--success); }
    .status-on_the_way, .status-on-the-way { background: var(--primary-100); color: var(--primary-dark); }
    .status-cancelled, .status-canceled    { background: var(--danger-100);  color: var(--danger); }
    .status-delivered, .status-completed   { background: var(--success-50);  color: var(--success-dark); }

    /* =========================================================
       TABLES
    ========================================================= */
    .table { font-size: 13.5px; color: var(--text-primary); --bs-table-bg: transparent; }
    .table th {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted);
      border-bottom: 1.5px solid var(--border);
      padding: 10px 16px; background: var(--bg); white-space: nowrap;
    }
    .table td {
      padding: 13px 16px; vertical-align: middle;
      border-bottom: 1px solid var(--border-light);
    }
    .table tbody tr:last-child td { border-bottom: 0; }
    .table tbody tr { transition: background .1s; }
    .table tbody tr:hover td { background: var(--primary-50); }

    /* =========================================================
       ALERTS
    ========================================================= */
    .alert {
      border-radius: var(--r-lg); font-size: 13.5px; border: none;
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    }
    .alert-info    { background: var(--accent-50);   color: var(--accent-dark);  border-left: 3px solid var(--accent); }
    .alert-success { background: var(--success-50);  color: var(--success-dark); border-left: 3px solid var(--success); }
    .alert-warning { background: var(--warning-50);  color: var(--warning-dark); border-left: 3px solid var(--warning); }
    .alert-danger  { background: var(--danger-50);   color: var(--danger-dark);  border-left: 3px solid var(--danger); }
    .alert-primary { background: var(--primary-50);  color: var(--primary-dark); border-left: 3px solid var(--primary); }

    /* =========================================================
       ICON BOXES
    ========================================================= */
    .icon-box    { width:40px; height:40px; border-radius:var(--r-lg); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
    .icon-box-xs { width:28px; height:28px; border-radius:var(--r);    font-size:13px; }
    .icon-box-sm { width:32px; height:32px; border-radius:var(--r);    font-size:14px; }
    .icon-box-lg { width:52px; height:52px; border-radius:var(--r-xl); font-size:22px; }
    .icon-box-xl { width:64px; height:64px; border-radius:var(--r-xl); font-size:28px; }
    .icon-box-primary { background: var(--primary-100); color: var(--primary); }
    .icon-box-success { background: var(--success-100); color: var(--success); }
    .icon-box-warning { background: var(--warning-100); color: var(--warning); }
    .icon-box-danger  { background: var(--danger-100);  color: var(--danger);  }
    .icon-box-accent  { background: var(--accent-100);  color: var(--accent);  }
    .icon-box-neutral { background: var(--border-light); color: var(--text-muted); }

    /* =========================================================
       AVATARS
    ========================================================= */
    .avatar    { width:36px; height:36px; border-radius:var(--r-full); object-fit:cover; flex-shrink:0; }
    .avatar-sm { width:28px; height:28px; }
    .avatar-lg { width:56px; height:56px; }
    .avatar-xl { width:96px; height:96px; }

    /* =========================================================
       PAGE HEADER
    ========================================================= */
    .page-header   { margin-bottom: 24px; }
    .page-title    { font-size: 22px; font-weight: 800; color: var(--text-primary); margin: 0; line-height: 1.2; letter-spacing: -.03em; }
    .page-subtitle { font-size: 13.5px; color: var(--text-muted); margin-top: 4px; margin-bottom: 0; }

    /* =========================================================
       STAT CARDS
    ========================================================= */
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 22px 24px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s cubic-bezier(.4,0,.2,1), transform .2s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      opacity: 0;
      transition: opacity .2s;
    }
    .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
    .stat-card:hover::after { opacity: 1; }
    .stat-value { font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -.04em; color: var(--text-primary); }
    .stat-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-top: 6px; }

    /* =========================================================
       EMPTY STATES
    ========================================================= */
    .empty-state {
      text-align: center;
      padding: 56px 24px;
      max-width: 360px;
      margin: 0 auto;
    }
    .empty-state-icon { font-size: 48px; color: var(--border-medium); margin-bottom: 18px; line-height: 1; }
    .empty-state h5   { font-size: 16px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
    .empty-state p    { font-size: 13.5px; color: var(--text-muted); line-height: 1.65; margin-bottom: 20px; }

    /* =========================================================
       MISC
    ========================================================= */
    .divider  { height: 1px; background: var(--border); margin: 16px 0; }
    .notif-dot {
      position: absolute; top: 4px; right: 4px;
      width: 8px; height: 8px;
      background: var(--danger);
      border-radius: var(--r-full);
      border: 2px solid var(--surface);
      animation: pulse-ring 2s infinite;
    }

    /* Quick action cards */
    .quick-action-card {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; border-radius: var(--r-lg);
      border: 1.5px solid transparent;
      text-decoration: none;
      transition: transform .2s cubic-bezier(.4,0,.2,1), box-shadow .2s cubic-bezier(.4,0,.2,1), border-color .15s;
    }
    .quick-action-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .quick-action-card.blue   { background: var(--primary-50);  border-color: var(--primary-100); }
    .quick-action-card.green  { background: var(--success-50);  border-color: var(--success-100); }
    .quick-action-card.teal   { background: var(--accent-50);   border-color: var(--accent-100);  }
    .quick-action-card.orange { background: var(--warning-50);  border-color: var(--warning-100); }
    .quick-action-card.blue:hover   { border-color: var(--primary); }
    .quick-action-card.green:hover  { border-color: var(--success); }
    .quick-action-card.teal:hover   { border-color: var(--accent);  }
    .quick-action-card.orange:hover { border-color: var(--warning); }

    /* =========================================================
       SKELETON LOADER
    ========================================================= */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--border-light) 25%, #e4e9f0 50%, var(--border-light) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.6s infinite linear;
      border-radius: var(--r);
    }
    .skeleton-text   { height: 13px; }
    .skeleton-title  { height: 20px; width: 55%; }
    .skeleton-circle { border-radius: 50%; }
    .skeleton-card   { height: 110px; border-radius: var(--r-xl); }

    /* =========================================================
       TOAST SYSTEM
    ========================================================= */
    .toast-container {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(380px, calc(100vw - 40px));
      pointer-events: none;
    }
    .toast-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-lg);
      animation: slideInRight .25s cubic-bezier(.4,0,.2,1) both;
      position: relative;
      overflow: hidden;
      pointer-events: auto;
    }
    .toast-item::before {
      content: ''; position: absolute;
      left: 0; top: 0; bottom: 0; width: 3px;
    }
    .toast-success::before { background: var(--success); }
    .toast-error::before   { background: var(--danger);  }
    .toast-warning::before { background: var(--warning); }
    .toast-info::before    { background: var(--primary); }
    .toast-icon { flex-shrink: 0; font-size: 16px; margin-top: 1px; }
    .toast-success .toast-icon { color: var(--success); }
    .toast-error   .toast-icon { color: var(--danger);  }
    .toast-warning .toast-icon { color: var(--warning); }
    .toast-info    .toast-icon { color: var(--primary); }
    .toast-body   { flex: 1; min-width: 0; }
    .toast-title  { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .toast-msg    { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
    .toast-close  {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 14px; padding: 2px 4px;
      border-radius: var(--r-sm); flex-shrink: 0;
      transition: color .1s;
    }
    .toast-close:hover { color: var(--text-primary); }

    /* =========================================================
       SCROLLBAR
    ========================================================= */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* =========================================================
       ANIMATIONS
    ========================================================= */
    @keyframes fadeUp      { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeDown    { from { transform: translateY(-14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn      { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn     { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes slideInRight{ from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes spin        { to { transform: rotate(360deg); } }
    @keyframes pulse       { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes pulse-ring  { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,.4); } 70% { box-shadow: 0 0 0 6px rgba(220,38,38,0); } 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); } }

    .animate-fade-up    { animation: fadeUp    .3s cubic-bezier(.4,0,.2,1) both; }
    .animate-fade-in    { animation: fadeIn    .2s ease both; }
    .animate-fade-down  { animation: fadeDown  .3s cubic-bezier(.4,0,.2,1) both; }
    .animate-scale-in   { animation: scaleIn   .25s cubic-bezier(.4,0,.2,1) both; }
    .animate-slide-right{ animation: slideInRight .3s cubic-bezier(.4,0,.2,1) both; }

    .delay-1 { animation-delay: .06s; }
    .delay-2 { animation-delay: .12s; }
    .delay-3 { animation-delay: .18s; }
    .delay-4 { animation-delay: .24s; }
    .delay-5 { animation-delay: .30s; }

    /* =========================================================
       RESPONSIVE
    ========================================================= */
    @media (max-width: 768px) {
      .card-body { padding: 16px; }
      .card-header { padding: 14px 16px; }
      .empty-state { padding: 40px 20px; }
      .stat-card { padding: 16px 18px; }
      .stat-value { font-size: 24px; }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Global Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  {% block body %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ---- Auto-dismiss Django alerts ---- */
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('[data-auto-dismiss]').forEach(el => {
        setTimeout(() => {
          el.style.transition = 'opacity .35s, transform .35s';
          el.style.opacity    = '0';
          el.style.transform  = 'translateX(16px)';
          setTimeout(() => el.remove(), 350);
        }, 5000);
      });
    });

    /* ---- Toast System ---- */
    const TOAST_ICONS = {
      success: 'bi-check-circle-fill',
      error:   'bi-x-circle-fill',
      warning: 'bi-exclamation-triangle-fill',
      info:    'bi-info-circle-fill',
    };

    function showToast({ type = 'info', title = '', message = '', duration = 5000 } = {}) {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `toast-item toast-${type}`;
      el.setAttribute('role', 'alert');
      el.innerHTML = `
        <i class="bi ${TOAST_ICONS[type] || TOAST_ICONS.info} toast-icon"></i>
        <div class="toast-body">
          ${title   ? `<div class="toast-title">${title}</div>`  : ''}
          ${message ? `<div class="toast-msg">${message}</div>`  : ''}
        </div>
        <button class="toast-close" aria-label="Close"><i class="bi bi-x"></i></button>
      `;
      const close = () => {
        el.style.transition = 'opacity .2s, transform .2s';
        el.style.opacity = '0'; el.style.transform = 'translateX(20px)';
        setTimeout(() => el.remove(), 200);
      };
      el.querySelector('.toast-close').addEventListener('click', close);
      container.appendChild(el);
      if (duration > 0) setTimeout(close, duration);
      return el;
    }

    /* ---- Password visibility toggle (global) ---- */
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.btn-eye').forEach(btn => {
        btn.addEventListener('click', function () {
          const wrap  = this.closest('.input-wrap') || this.parentElement;
          const input = wrap.querySelector('input[type="password"], input[type="text"]');
          if (!input) return;
          const hidden = input.type === 'password';
          input.type  = hidden ? 'text'     : 'password';
          const icon  = this.querySelector('i');
          if (icon) icon.className = hidden ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
      });
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
